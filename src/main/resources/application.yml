api-football:
  enabled: ${API_FOOTBALL_ENABLED:false}
  key: ${API_FOOTBALL_KEY:}
  base-url: ${API_FOOTBALL_BASE_URL:https://v3.football.api-sports.io}
  league-id: ${API_FOOTBALL_LEAGUE_ID:135}
  season: ${API_FOOTBALL_SEASON:${CURRENT_YEAR:2026}}
  connect-timeout-ms: ${API_FOOTBALL_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${API_FOOTBALL_READ_TIMEOUT_MS:10000}
  min-request-interval-ms: ${API_FOOTBALL_MIN_REQUEST_INTERVAL_MS:6500}
  cron: "${API_FOOTBALL_CRON:0 0 3 * * MON}"

spring:
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
